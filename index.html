<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scanner">
<title>Device Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
  :root { --bg:#0f1720; --card:#18232f; --line:#2a3a4a; --text:#eef3f7; --muted:#8fa3b5;
          --ok:#2fbf71; --warn:#f2a93b; --bad:#e5534b; --accent:#3b8eea; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { padding:12px 12px calc(24px + env(safe-area-inset-bottom)); max-width:520px; margin:0 auto; }
  h1 { font-size:18px; margin:4px 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; min-width:0; }
  label { display:block; font-size:12px; color:var(--muted); margin:0 0 3px; }
  input,select { width:100%; font-size:16px; padding:10px; border-radius:8px; border:1px solid var(--line);
    background:#0f1720; color:var(--text); }
  .check { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:14px; color:var(--muted); }
  .check input { width:auto; }
  button { font-size:16px; font-weight:600; padding:12px; border-radius:10px; border:0; background:var(--accent);
    color:#fff; width:100%; }
  button.secondary { background:#2a3a4a; }
  button:disabled { opacity:.5; }
  .video-wrap { position:relative; background:#000; border-radius:12px; overflow:hidden; aspect-ratio:4/3; margin-bottom:10px; }
  video { width:100%; height:100%; object-fit:cover; display:block; }
  .reticle { position:absolute; left:5%; top:37%; width:90%; height:26%; border:2px solid rgba(255,255,255,.85); border-radius:10px; pointer-events:none; box-shadow:0 0 0 9999px rgba(0,0,0,.35); }
  .flash { position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .35s; }
  .flash.ok { background:rgba(47,191,113,.45); opacity:1; transition:none; }
  .flash.warn { background:rgba(242,169,59,.5); opacity:1; transition:none; }
  .flash.bad { background:rgba(229,83,75,.5); opacity:1; transition:none; }
  .placeholder { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--muted); text-align:center; padding:20px; font-size:14px; }
  #result { min-height:72px; }
  .code { font:600 20px ui-monospace,Menlo,monospace; word-break:break-all; }
  .status { font-size:14px; margin-top:4px; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .muted { color:var(--muted); font-size:13px; }
  ul { list-style:none; margin:0; padding:0; }
  li { padding:8px 0; border-top:1px solid var(--line); font-size:14px; display:flex; justify-content:space-between; gap:8px; }
  li:first-child { border-top:0; }
  li .c { font-family:ui-monospace,Menlo,monospace; word-break:break-all; }
  li .t { color:var(--muted); white-space:nowrap; font-size:12px; }
  .btnrow { display:flex; gap:8px; margin-top:8px; }
  .hidden { display:none !important; }
  .slot { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 0; border-top:1px solid var(--line); font-size:14px; }
  .slot:first-child { border-top:0; }
  .slot .k { color:var(--muted); min-width:112px; }
  .slot .v { font-family:ui-monospace,Menlo,monospace; word-break:break-all; flex:1; }
  .slot .x { width:34px; padding:4px; font-size:14px; background:#2a3a4a; }
  .thumbs { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .thumb { position:relative; }
  .thumb img { width:72px; height:72px; object-fit:cover; border-radius:8px; border:1px solid var(--line); display:block; }
  .thumb button { position:absolute; top:-6px; right:-6px; width:24px; height:24px; padding:0; border-radius:12px; font-size:13px; background:#e5534b; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chips button { width:auto; padding:8px 10px; font-size:14px; }
</style>
</head>
<body>
<h1>Device Scanner <span id="queueBadge" class="muted"></span></h1>

<div class="card">
  <div class="row">
    <div><label for="scannedBy">Scanned by</label><input id="scannedBy" autocomplete="name" placeholder="Your name"></div>
    <div><label for="location">Location</label>
      <select id="location">
        <option>Dallas/Fort Worth</option>
        <option>San Antonio</option>
        <option>Houston</option>
        <option>Other</option>
      </select></div>
  </div>
  <div style="margin-top:8px">
    <label for="deviceType">Device type</label>
    <input id="deviceType" list="deviceTypes" placeholder="iPad, iPhone, laptop... (type anything)">
    <datalist id="deviceTypes">
      <option value="iPad"><option value="iPhone"><option value="Laptop"><option value="Phone (Android)">
      <option value="Tablet (other)"><option value="Asset tag">
    </datalist>
  </div>
  <label class="check"><input type="checkbox" id="stripS"> Apple box serial: remove leading "S" from the barcode</label>
</div>

<div class="video-wrap" id="videoWrap">
  <video id="video" playsinline muted></video>
  <div class="reticle" id="reticle"></div>
  <div id="flash" class="flash"></div>
  <div id="placeholder" class="placeholder">Tap Start scanning, then line the white box up with ONE barcode or QR code.</div>
</div>
<div style="margin:0 0 8px">
  <label for="aim">Aim box (only the barcode inside the white box is read)</label>
  <select id="aim">
    <option value="wide">Wide box: barcodes</option>
    <option value="square">Square box: QR codes</option>
    <option value="full">Whole screen: any code</option>
  </select>
</div>
<div class="btnrow" style="margin:0 0 12px">
  <button id="startBtn">Start scanning</button>
  <button id="stopBtn" class="secondary hidden">Stop</button>
</div>

<div id="result" class="card">
  <div class="muted">Nothing scanned yet.</div>
</div>

<div class="card" id="deviceCard">
  <label>Current device: scan each barcode on the box, then tap Save device</label>
  <div id="slots"></div>
  <div id="pending"></div>
  <div class="btnrow" style="margin-top:10px">
    <button id="photoBtn" class="secondary">Add photo of box label</button>
  </div>
  <input id="photoInput" type="file" accept="image/*" capture="environment" class="hidden">
  <div id="thumbs" class="thumbs"></div>
  <div id="photoMsg" class="muted" style="margin-top:6px"></div>
  <div id="harder" class="btnrow hidden"><button id="harderBtn" class="secondary">Look harder for small barcodes</button></div>
  <input id="notes" placeholder="Notes (optional)" style="margin-top:8px">
  <div class="btnrow">
    <button id="saveDev">Save device</button>
    <button id="clearDev" class="secondary">Clear</button>
  </div>
  <div id="devStatus" class="status"></div>
</div>

<div class="card">
  <label>Type or paste a code</label>
  <div class="row">
    <input id="manual" placeholder="Type or paste a code" autocapitalize="characters" autocomplete="off">
    <button id="manualBtn" class="secondary" style="flex:0 0 90px">Add</button>
  </div>
</div>

<div class="card">
  <label>Recent scans (this phone)</label>
  <ul id="recent"><li><span class="muted">None yet.</span></li></ul>
</div>

<script>
// ---------------- Config ----------------
// Leave blank when this page is served by Apps Script (the normal setup).
// Only fill these in if you later host this page somewhere else.
var CFG = { API_URL: 'https://script.google.com/macros/s/AKfycbyDNe2VochuLvMjPfheb0yCEbtB98jsMjHsnjHDzo6DPcA6TYsMqOmVLAlGYu0W_UqWbg/exec', API_KEY: 'UFYTKJRHj7FXJ4B4y3Wg5uD_' };

// ---------------- Helpers ----------------
function $(id) { return document.getElementById(id); }
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
    var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16);
  });
}
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function timeLabel(d) { return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }

// ---------------- Settings ----------------
['scannedBy', 'location', 'deviceType'].forEach(function (id) {
  var v = store.get('ds_' + id); if (v) $(id).value = v;
  $(id).addEventListener('change', function () { store.set('ds_' + id, $(id).value); });
  $(id).addEventListener('input', function () { store.set('ds_' + id, $(id).value); });
});
$('stripS').checked = store.get('ds_stripS') === '1';
$('stripS').addEventListener('change', function () { store.set('ds_stripS', $('stripS').checked ? '1' : '0'); });

// ---------------- Sending to the Sheet ----------------
var hasGAS = typeof google !== 'undefined' && google.script && google.script.run;

function callServer(fn, payload) {
  return new Promise(function (resolve, reject) {
    if (hasGAS) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(new Error(e && e.message ? e.message : String(e)));
      })[fn](payload);
    } else if (CFG.API_URL) {
      var body = JSON.stringify({ action: fn, key: CFG.API_KEY, payload: payload });
      fetch(CFG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body })
        .then(function (r) { return r.json(); }).then(resolve).catch(reject);
    } else {
      reject(new Error('Not connected to a Sheet'));
    }
  });
}

// Offline queue: scans that could not be sent are kept and retried.
function getQueue() { try { return JSON.parse(store.get('ds_queue') || '[]'); } catch (e) { return []; } }
function setQueue(q) { store.set('ds_queue', JSON.stringify(q)); renderQueue(); }
function renderQueue() { var n = getQueue().length; $('queueBadge').textContent = n ? '(' + n + ' waiting to send)' : ''; }
var flushing = false;
function flushQueue() {
  if (flushing) return; var q = getQueue(); if (!q.length) return; flushing = true;
  (function next(i) {
    if (i >= q.length) { flushing = false; return; }
    callServer(q[i].fn || 'recordScan', q[i].payload || q[i]).then(function () {
      var cur = getQueue().filter(function (x) { return x.id !== q[i].id; }); setQueue(cur); next(i + 1);
    }).catch(function () { flushing = false; });
  })(0);
}
window.addEventListener('online', flushQueue);
setInterval(flushQueue, 20000);
renderQueue();

// ---------------- Recording a scan ----------------
var recent = []; var lastScan = null;
function renderRecent() {
  if (!recent.length) return;
  $('recent').innerHTML = recent.map(function (r) {
    return '<li><span class="c">' + esc(r.code) + (r.flag ? ' <span class="warn">' + esc(r.flag) + '</span>' : '') +
      '</span><span class="t">' + timeLabel(r.when) + '</span></li>';
  }).join('');
}
function showResult(code, format, statusHtml, canUndo) {
  $('result').innerHTML = '<div class="code">' + esc(code) + '</div><div class="muted">' + esc(format || '') +
    '</div><div class="status">' + statusHtml + '</div>' +
    (canUndo ? '<div class="btnrow"><button id="undoBtn" class="secondary">Undo this scan</button></div>' : '');
  if (canUndo) $('undoBtn').addEventListener('click', undoLast);
}
function flash(kind) {
  var f = $('flash'); f.className = 'flash ' + kind;
  setTimeout(function () { f.className = 'flash'; }, 120);
}

var audioCtx = null;
function beep(freq, ms) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq; g.gain.value = 0.15; o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + ms / 1000);
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
}

function handleCode(raw, format) {
  var code = String(raw || '').trim();
  if (!code) return;
  var field = classify(code, format);
  if (field === 'skip') return;
  if (field === 'serial' && $('stripS').checked && /^S/i.test(code) && code.length > 1) code = code.slice(1);
  var scan = {
    id: uuid(), code: code, format: format || 'MANUAL',
    deviceType: $('deviceType').value.trim(), scannedBy: $('scannedBy').value.trim(),
    location: $('location').value, ts: new Date().toISOString()
  };
  lastScan = scan;
  assignToDraft(code, field);
  var entry = { code: code, when: new Date(), flag: '' };
  recent.unshift(entry); if (recent.length > 10) recent.pop(); renderRecent();
  showResult(code, format, '<span class="muted">Saving...</span>', false);

  callServer('recordScan', scan).then(function (res) {
    if (res && res.ok) {
      if (res.duplicate) {
        entry.flag = 'duplicate'; flash('warn'); beep(330, 250);
        showResult(code, format, '<span class="warn">Saved, but already scanned ' + esc(res.firstSeen || '') + '</span>', true);
      } else {
        flash('ok'); beep(880, 120);
        showResult(code, format, '<span class="ok">Saved</span>', true);
      }
    } else {
      throw new Error((res && res.error) || 'Server said no');
    }
    renderRecent(); flushQueue();
  }).catch(function (e) {
    var q = getQueue(); q.push({ fn: 'recordScan', payload: scan, id: scan.id }); setQueue(q);
    entry.flag = 'queued'; flash('bad'); beep(200, 300); renderRecent();
    showResult(code, format, '<span class="bad">Not sent (' + esc(e.message) + '). Kept on this phone and will retry.</span>', false);
  });
}

function undoLast() {
  if (!lastScan) return;
  var s = lastScan; lastScan = null;
  // If it never reached the Sheet, just drop it from the queue.
  setQueue(getQueue().filter(function (x) { return x.id !== s.id; }));
  callServer('undoScan', { id: s.id }).then(function () {
    $('result').innerHTML = '<div class="status warn">Removed ' + esc(s.code) + '</div>';
    if (recent.length && recent[0].code === s.code) recent.shift();
    if (!recent.length) $('recent').innerHTML = '<li><span class="muted">None yet.</span></li>'; else renderRecent();
  }).catch(function (e) {
    $('result').innerHTML = '<div class="status bad">Could not undo: ' + esc(e.message) + '</div>';
  });
}

// ---------------- Current device (one row per device on the "Devices" tab) ----------------
var SLOTS = [['serial', 'Serial'], ['part', 'Part / Model No.'], ['upc', 'UPC'], ['imei', 'IMEI'],
             ['imei2', 'IMEI 2'], ['eid', 'EID'], ['other', 'Asset tag / other']];
var draft = loadDraft();
var photos = [];   // pictures attached to the current device (kept in memory)
function newDraft() { return { id: uuid(), fields: {}, pending: '', more: [] }; }
function loadDraft() { try { var d = JSON.parse(store.get('ds_draft')); if (d && d.fields) { d.more = d.more || []; return d; } } catch (e) {} return newDraft(); }
function saveDraftLocal() { store.set('ds_draft', JSON.stringify(draft)); }

// Guess which slot a scanned code belongs in. Returns null when unsure, and you pick.
function classify(code, fmt) {
  var c = String(code).trim();
  if (/^(QR_CODE|DATA_MATRIX)$/.test(fmt) && /apple\.com|apple\.co\b/i.test(c)) return 'skip';   // same on every box, not an ID
  if (/^(UPC_A|UPC_E|EAN_13|EAN_8)$/.test(fmt)) {
    var cur = draft.fields.upc;
    if (!cur || cur === c) return 'upc';
    // A box can carry two product codes (US UPC and a regional EAN). The 12-digit UPC-A keeps the UPC slot;
    // the other one is kept in Notes so it is not lost and cannot match other devices.
    var keep = (fmt === 'UPC_A' && !/^\d{12}$/.test(cur)) ? c : cur, other = (keep === c) ? cur : c;
    draft.fields.upc = keep;
    var tag = 'Other product code: ' + other;
    if ((draft.notes || '').indexOf(other) < 0) draft.notes = ((draft.notes || '') + (draft.notes ? '; ' : '') + tag);
    saveDraftLocal(); renderDraft();
    return 'skip';
  }
  if (/^\d{15}$/.test(c)) return (draft.fields.imei && draft.fields.imei !== c) ? 'imei2' : 'imei';
  if (/^\d{32}$/.test(c)) return 'eid';
  if (/^[A-Z0-9]{3,6}[A-Z]{1,3}\/[A-Z0-9]$/i.test(c) || /^A\d{4}$/i.test(c)) return 'part';
  if (/^(QR_CODE|DATA_MATRIX|AZTEC|PDF_417)$/.test(fmt)) return 'other';
  if (/^[A-Z0-9]{8,12}$/i.test(c) && /[A-Z]/i.test(c) && /\d/.test(c)) return 'serial';
  return null;
}
function assignToDraft(code, field) {
  if (field) { draft.fields[field] = code; }
  else if (draft.pending) { if (draft.pending !== code && draft.more.indexOf(code) < 0) draft.more.push(code); }
  else { draft.pending = code; }
  saveDraftLocal(); renderDraft();
}
function renderDraft() {
  $('slots').innerHTML = SLOTS.map(function (s) {
    var v = draft.fields[s[0]];
    return '<div class="slot"><span class="k">' + esc(s[1]) + '</span><span class="v">' +
      (v ? esc(v) : '<span class="muted">-</span>') + '</span>' +
      (v ? '<button class="x" data-k="' + s[0] + '" aria-label="Clear ' + esc(s[1]) + '">x</button>' : '') + '</div>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#slots .x'), function (b) {
    b.addEventListener('click', function () { delete draft.fields[b.getAttribute('data-k')]; saveDraftLocal(); renderDraft(); });
  });
  if (draft.pending) {
    $('pending').innerHTML = '<div class="muted" style="margin-top:8px">What is <b>' + esc(draft.pending) + '</b>?</div><div class="chips">' +
      SLOTS.map(function (s) { return '<button class="secondary pickslot" data-k="' + s[0] + '">' + esc(s[1]) + '</button>'; }).join('') +
      '<button class="secondary pickslot" data-k="">Ignore</button></div>';
    Array.prototype.forEach.call(document.querySelectorAll('.pickslot'), function (b) {
      b.addEventListener('click', function () {
        var k = b.getAttribute('data-k');
        if (k) draft.fields[k] = draft.pending;
        draft.pending = draft.more.shift() || ''; saveDraftLocal(); renderDraft();
      });
    });
  } else { $('pending').innerHTML = ''; }
  $('notes').value = draft.notes || '';
}
$('notes').addEventListener('input', function () { draft.notes = $('notes').value; saveDraftLocal(); });
function resetDraft() { draft = newDraft(); photos = []; lastPhoto = null; saveDraftLocal(); renderDraft(); renderPhotos(); }
$('clearDev').addEventListener('click', function () { resetDraft(); $('devStatus').innerHTML = ''; });
$('saveDev').addEventListener('click', function () {
  var f = draft.fields;
  if (!(f.serial || f.imei || f.imei2 || f.eid || f.other)) {
    $('devStatus').innerHTML = '<span class="warn">Scan a serial, IMEI, EID or asset tag first.</span>'; return;
  }
  var payload = { id: draft.id, fields: f, notes: ($('notes').value || '').trim(), deviceType: $('deviceType').value.trim(),
                  scannedBy: $('scannedBy').value.trim(), location: $('location').value, ts: new Date().toISOString(),
                  photos: photos.map(function (p) { return { data: p.data }; }) };
  $('devStatus').innerHTML = '<span class="muted">Saving' + (photos.length ? ' (uploading ' + photos.length + ' photo' + (photos.length > 1 ? 's' : '') + ' and reading the label; this can take 10 to 30 seconds)' : '') + '...</span>';
  callServer('saveDevice', payload).then(function (res) {
    if (!res || !res.ok) throw new Error((res && res.error) || 'Server said no');
    var d = res.details || {}, bits = [d.name, d.storage, d.color].filter(Boolean).join(', ');
    var more = bits ? '<br><span class="muted">Model: ' + esc(bits) + (d.source ? ' (from ' + esc(d.source) + ')' : '') + '</span>'
      : (payload.photos.length ? '<br><span class="warn">Model details were not filled in. Check the row in the Sheet.</span>' : '');
    $('devStatus').innerHTML = (res.existing
      ? '<span class="warn">Already in the list (first saved ' + esc(res.firstSaved || '') + '). Updated that row.</span>'
      : '<span class="ok">Device saved. Ready for the next one.</span>') + more;
    beep(res.existing ? 330 : 880, 150); resetDraft();
  }).catch(function (e) {
    var q = getQueue(), note = '';
    q.push({ fn: 'saveDevice', payload: payload, id: payload.id });
    try { localStorage.setItem('ds_queue', JSON.stringify(q)); }
    catch (err) { payload.photos = []; note = ' The photos did not fit and were left out.'; q[q.length - 1].payload = payload; }
    setQueue(q);
    $('devStatus').innerHTML = '<span class="bad">Not sent (' + esc(e.message) + '). Kept on this phone and will retry.' + note + '</span>';
    resetDraft();
  });
});
renderDraft();

// ---------------- Camera scanning ----------------
var scanning = false, stream = null, timer = null;
var seenAt = {};   // code -> last time the camera saw it
var work = document.createElement('canvas');
var wctx = work.getContext('2d', { willReadFrequently: true });
var mfr = null, HINTS = null;

function formats() {
  var F = ZXing.BarcodeFormat;
  return [F.CODE_128, F.CODE_39, F.EAN_13, F.UPC_A, F.QR_CODE, F.DATA_MATRIX];
}
function decodeCanvas(c) {
  if (!mfr) {
    HINTS = new Map();
    HINTS.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats());
    HINTS.set(ZXing.DecodeHintType.TRY_HARDER, true);
    mfr = new ZXing.MultiFormatReader();
  }
  try {
    var src = new ZXing.HTMLCanvasElementLuminanceSource(c);
    var r = mfr.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src)), HINTS);
    return { text: r.getText(), format: ZXing.BarcodeFormat[r.getBarcodeFormat()] };
  } catch (e) { return null; }
}

// The aim box, in pixels inside the video area.
function currentBox() {
  var wrap = $('videoWrap'), cw = wrap.clientWidth, ch = wrap.clientHeight, m = $('aim').value;
  if (m === 'full') return { x: 0, y: 0, w: cw, h: ch };
  if (m === 'square') { var s = Math.round(0.7 * Math.min(cw, ch)); return { x: (cw - s) / 2, y: (ch - s) / 2, w: s, h: s }; }
  return { x: cw * 0.05, y: ch * 0.37, w: cw * 0.9, h: ch * 0.26 };
}
function placeReticle() {
  var b = currentBox(), r = $('reticle');
  r.style.left = b.x + 'px'; r.style.top = b.y + 'px'; r.style.width = b.w + 'px'; r.style.height = b.h + 'px';
  r.style.display = $('aim').value === 'full' ? 'none' : 'block';
}
// Convert the box on screen to the matching area of the camera picture (the video is shown "cover" style).
function videoRect(b) {
  var v = $('video'), wrap = $('videoWrap'), vw = v.videoWidth, vh = v.videoHeight;
  var cw = wrap.clientWidth, ch = wrap.clientHeight, s = Math.max(cw / vw, ch / vh);
  var ox = (vw * s - cw) / 2, oy = (vh * s - ch) / 2;
  return { sx: (b.x + ox) / s, sy: (b.y + oy) / s, sw: b.w / s, sh: b.h / s };
}

$('aim').value = store.get('ds_aim') || 'wide';
$('aim').addEventListener('change', function () { store.set('ds_aim', $('aim').value); placeReticle(); });
window.addEventListener('resize', placeReticle);
placeReticle();

function tick() {
  if (!scanning) return;
  var v = $('video');
  if (v.videoWidth && v.readyState >= 2) {
    var r = videoRect(currentBox());
    var base = 1;
    if (r.sw < 900) base = Math.min(2, 900 / r.sw);          // small areas: enlarge a little
    if (r.sw * base > 1800) base = 1800 / r.sw;              // big areas: keep it quick
    var res = null, tries = [base, base * 2, base * 3];     // if the first pass misses, retry enlarged (helps small or far-away codes)
    for (var t = 0; t < tries.length && !res; t++) {
      var sc = tries[t];
      if (t > 0 && r.sw * sc > 2600) break;
      work.width = Math.max(1, Math.round(r.sw * sc)); work.height = Math.max(1, Math.round(r.sh * sc));
      wctx.imageSmoothingEnabled = true; wctx.imageSmoothingQuality = 'high';
      wctx.drawImage(v, r.sx, r.sy, r.sw, r.sh, 0, 0, work.width, work.height);
      res = decodeCanvas(work);
    }
    if (res) {
      var now = Date.now(), prev = seenAt[res.text];
      seenAt[res.text] = now;                                   // refreshed every time the code is seen
      if (!(prev && now - prev < 8000)) handleCode(res.text, res.format);   // ignore a code still in view or seen moments ago
    }
  }
  timer = setTimeout(tick, 120);
}

function startScan() {
  if (typeof ZXing === 'undefined') {
    $('placeholder').textContent = 'The scanner library did not load. Check your connection and reload.'; return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    $('placeholder').innerHTML = 'Camera not available here.<br>Use <b>Take photo</b> or type the code below.'; return;
  }
  $('placeholder').classList.add('hidden');
  $('startBtn').classList.add('hidden'); $('stopBtn').classList.remove('hidden');
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {}
  navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
  }).then(function (s) {
    stream = s; var v = $('video'); v.srcObject = s;
    try {   // ask for continuous autofocus where the phone allows it
      var tr = s.getVideoTracks()[0], caps = tr.getCapabilities ? tr.getCapabilities() : null;
      if (caps && caps.focusMode && caps.focusMode.indexOf('continuous') > -1) tr.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
    } catch (e) {}
    return v.play().catch(function () {});
  }).then(function () {
    scanning = true; placeReticle(); tick();
  }).catch(function (e) {
    stopScan();
    $('placeholder').classList.remove('hidden');
    $('placeholder').innerHTML = 'Camera unavailable (' + esc(e && e.name ? e.name : 'error') +
      ').<br>Use <b>Take photo</b> or type the code below.';
  });
}
function stopScan() {
  scanning = false; clearTimeout(timer); seenAt = {};
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  try { $('video').srcObject = null; } catch (e) {}
  $('startBtn').classList.remove('hidden'); $('stopBtn').classList.add('hidden');
}
$('startBtn').addEventListener('click', startScan);
$('stopBtn').addEventListener('click', function () { stopScan(); $('placeholder').classList.remove('hidden'); });

// ---------------- Photos: read every barcode in the picture and keep the picture ----------------
var lastPhoto = null;   // { img, url, handled:{} } for the newest photo, so "Look harder" can reuse it
var GOOD_DEEP = /^(CODE_128|UPC_A|EAN_13|QR_CODE|DATA_MATRIX)$/;

// Find barcodes in a picture. Quick pass first; deep = enlarge overlapping tiles for small barcodes.
function findAllInImage(img, deep) {
  return new Promise(function (resolve) {
    var maxSide = 3000, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, maxSide / Math.max(w, h));
    var W = Math.round(w * k), H = Math.round(h * k);
    var full = document.createElement('canvas'); full.width = W; full.height = H;
    full.getContext('2d').drawImage(img, 0, 0, W, H);
    var found = {}, order = [], jobs = [];
    var c = document.createElement('canvas'), cx = c.getContext('2d', { willReadFrequently: true });
    function add(res) {
      if (!res || found[res.text]) return;
      if (deep && !GOOD_DEEP.test(res.format)) return;          // tiles can produce junk reads; keep only solid types
      found[res.text] = 1; order.push(res);
    }
    function region(x, y, rw, rh, up) {
      jobs.push(function () {
        c.width = Math.max(1, Math.round(rw * up)); c.height = Math.max(1, Math.round(rh * up));
        cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high';
        cx.drawImage(full, x, y, rw, rh, 0, 0, c.width, c.height);
        add(decodeCanvas(c));
      });
    }
    if (!deep) {
      jobs.push(function () { add(decodeCanvas(full)); });
      var bandH = H * 0.3;
      for (var y = 0; y + bandH <= H + 1; y += H * 0.1) region(0, Math.min(y, H - bandH), W, bandH, 1);
      var bandW = W * 0.5;
      for (var x = 0; x + bandW <= W + 1; x += W * 0.25) region(Math.min(x, W - bandW), 0, bandW, H, 1);
    } else {
      [[0.55, 0.14], [0.4, 0.2], [0.3, 0.1]].forEach(function (ts) {
        var tw = W * ts[0], th = H * ts[1], up = Math.min(3, Math.max(1, 1400 / tw));
        for (var ty = 0; ty < H - 1; ty += th * 0.5) {
          for (var tx = 0; tx < W - 1; tx += tw * 0.5) region(Math.min(tx, W - tw), Math.min(ty, H - th), tw, th, up);
        }
      });
    }
    (function step() {          // work in small slices so the page stays responsive
      var t0 = Date.now();
      while (jobs.length && Date.now() - t0 < 50) jobs.shift()();
      if (jobs.length) setTimeout(step, 0); else resolve(order);
    })();
  });
}

function shrinkToJpeg(img, maxSide, quality) {
  var k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
  var c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', quality);
}
function renderPhotos() {
  $('thumbs').innerHTML = photos.map(function (p) {
    return '<div class="thumb"><img src="' + p.thumb + '" alt="photo"><button data-id="' + p.id + '" aria-label="Remove photo">x</button></div>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.thumb button'), function (b) {
    b.addEventListener('click', function () { photos = photos.filter(function (p) { return p.id !== b.getAttribute('data-id'); }); renderPhotos(); });
  });
  if (!photos.length) $('photoMsg').textContent = '';
}
function applyFound(list, label) {
  var fresh = list.filter(function (r) { return !lastPhoto.handled[r.text]; });
  fresh.forEach(function (r) { lastPhoto.handled[r.text] = 1; handleCode(r.text, r.format); });
  var n = Object.keys(lastPhoto.handled).length;
  $('photoMsg').textContent = n
    ? label + ' ' + n + ' barcode' + (n > 1 ? 's' : '') + ' read from this photo. Check the slots above.'
    : 'No barcodes read from that photo. It is still attached. Try Look harder, or get closer.';
  $('harder').classList.remove('hidden');
}
$('photoBtn').addEventListener('click', function () { $('photoInput').click(); });
$('photoInput').addEventListener('change', function () {
  var f = this.files && this.files[0]; this.value = ''; if (!f) return;
  if (typeof ZXing === 'undefined') { $('photoMsg').textContent = 'Scanner library did not load.'; return; }
  if (lastPhoto) { try { URL.revokeObjectURL(lastPhoto.url); } catch (e) {} }
  $('photoMsg').textContent = 'Reading photo...'; $('harder').classList.add('hidden');
  var url = URL.createObjectURL(f), img = new Image();
  img.onload = function () {
    var jpg = shrinkToJpeg(img, 2000, 0.78);   // big enough for the label text to be readable
    if (photos.length < 4) { photos.push({ id: uuid(), data: jpg.split(',')[1], thumb: shrinkToJpeg(img, 160, 0.6) }); renderPhotos(); }
    lastPhoto = { img: img, url: url, handled: {} };
    $('photoMsg').textContent = 'Reading photo...';
    setTimeout(function () { findAllInImage(img, false).then(function (list) { applyFound(list, 'Found'); }); }, 30);
  };
  img.onerror = function () { URL.revokeObjectURL(url); $('photoMsg').textContent = 'Could not open that photo.'; };
  img.src = url;
});
$('harderBtn').addEventListener('click', function () {
  if (!lastPhoto) return;
  $('photoMsg').textContent = 'Looking harder... this can take up to half a minute.'; $('harder').classList.add('hidden');
  findAllInImage(lastPhoto.img, true).then(function (list) { applyFound(list, 'Now'); });
});
renderPhotos();
function addManual() {
  var v = $('manual').value.trim(); if (!v) return;
  $('manual').value = ''; handleCode(v, 'MANUAL');
}
$('manualBtn').addEventListener('click', addManual);
$('manual').addEventListener('keydown', function (e) { if (e.key === 'Enter') addManual(); });

document.addEventListener('visibilitychange', function () { if (document.hidden && scanning) stopScan(); });
</script>
</body>
