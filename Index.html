<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scanner">
<title>Device Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
  :root { --bg:#0f1720; --card:#18232f; --line:#2a3a4a; --text:#eef3f7; --muted:#8fa3b5;
          --ok:#2fbf71; --warn:#f2a93b; --bad:#e5534b; --accent:#3b8eea; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { padding:12px 12px calc(24px + env(safe-area-inset-bottom)); max-width:520px; margin:0 auto; }
  h1 { font-size:18px; margin:4px 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; min-width:0; }
  label { display:block; font-size:12px; color:var(--muted); margin:0 0 3px; }
  input,select { width:100%; font-size:16px; padding:10px; border-radius:8px; border:1px solid var(--line);
    background:#0f1720; color:var(--text); }
  .check { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:14px; color:var(--muted); }
  .check input { width:auto; }
  button { font-size:16px; font-weight:600; padding:12px; border-radius:10px; border:0; background:var(--accent);
    color:#fff; width:100%; }
  button.secondary { background:#2a3a4a; }
  button:disabled { opacity:.5; }
  .video-wrap { position:relative; background:#000; border-radius:12px; overflow:hidden; aspect-ratio:4/3; margin-bottom:10px; }
  video { width:100%; height:100%; object-fit:cover; display:block; }
  .reticle { position:absolute; inset:18% 8%; border:2px solid rgba(255,255,255,.7); border-radius:10px; pointer-events:none; }
  .flash { position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .35s; }
  .flash.ok { background:rgba(47,191,113,.45); opacity:1; transition:none; }
  .flash.warn { background:rgba(242,169,59,.5); opacity:1; transition:none; }
  .flash.bad { background:rgba(229,83,75,.5); opacity:1; transition:none; }
  .placeholder { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--muted); text-align:center; padding:20px; font-size:14px; }
  #result { min-height:72px; }
  .code { font:600 20px ui-monospace,Menlo,monospace; word-break:break-all; }
  .status { font-size:14px; margin-top:4px; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .muted { color:var(--muted); font-size:13px; }
  ul { list-style:none; margin:0; padding:0; }
  li { padding:8px 0; border-top:1px solid var(--line); font-size:14px; display:flex; justify-content:space-between; gap:8px; }
  li:first-child { border-top:0; }
  li .c { font-family:ui-monospace,Menlo,monospace; word-break:break-all; }
  li .t { color:var(--muted); white-space:nowrap; font-size:12px; }
  .btnrow { display:flex; gap:8px; margin-top:8px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<h1>Device Scanner <span id="queueBadge" class="muted"></span></h1>

<div class="card">
  <div class="row">
    <div><label for="scannedBy">Scanned by</label><input id="scannedBy" autocomplete="name" placeholder="Your name"></div>
    <div><label for="location">Location</label>
      <select id="location">
        <option>Dallas/Fort Worth</option>
        <option>San Antonio</option>
        <option>Houston</option>
        <option>Other</option>
      </select></div>
  </div>
  <div style="margin-top:8px">
    <label for="deviceType">Device type</label>
    <input id="deviceType" list="deviceTypes" placeholder="iPad, iPhone, laptop... (type anything)">
    <datalist id="deviceTypes">
      <option value="iPad"><option value="iPhone"><option value="Laptop"><option value="Phone (Android)">
      <option value="Tablet (other)"><option value="Asset tag">
    </datalist>
  </div>
  <label class="check"><input type="checkbox" id="stripS"> Apple box serial: remove leading "S" from the barcode</label>
</div>

<div class="video-wrap">
  <video id="video" playsinline muted></video>
  <div class="reticle"></div>
  <div id="flash" class="flash"></div>
  <div id="placeholder" class="placeholder">Tap Start scanning, then point the camera at a barcode or QR code.</div>
</div>
<div class="btnrow" style="margin:0 0 12px">
  <button id="startBtn">Start scanning</button>
  <button id="stopBtn" class="secondary hidden">Stop</button>
</div>

<div id="result" class="card">
  <div class="muted">Nothing scanned yet.</div>
</div>

<div class="card">
  <label>Camera not working? Take a photo of the barcode, or type it in.</label>
  <div class="btnrow">
    <button id="photoBtn" class="secondary">Take photo</button>
  </div>
  <input id="photoInput" type="file" accept="image/*" capture="environment" class="hidden">
  <div class="row" style="margin-top:8px">
    <input id="manual" placeholder="Type or paste a code" autocapitalize="characters" autocomplete="off">
    <button id="manualBtn" class="secondary" style="flex:0 0 90px">Add</button>
  </div>
</div>

<div class="card">
  <label>Recent scans (this phone)</label>
  <ul id="recent"><li><span class="muted">None yet.</span></li></ul>
</div>

<script>
// ---------------- Config ----------------
// Leave blank when this page is served by Apps Script (the normal setup).
// Only fill these in if you later host this page somewhere else.
var CFG = { API_URL: 'https://script.google.com/macros/s/AKfycbyDNe2VochuLvMjPfheb0yCEbtB98jsMjHsnjHDzo6DPcA6TYsMqOmVLAlGYu0W_UqWbg/exec', API_KEY: 'UFYTKJRHj7FXJ4B4y3Wg5uD_' };

// ---------------- Helpers ----------------
function $(id) { return document.getElementById(id); }
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
    var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16);
  });
}
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function timeLabel(d) { return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }

// ---------------- Settings ----------------
['scannedBy', 'location', 'deviceType'].forEach(function (id) {
  var v = store.get('ds_' + id); if (v) $(id).value = v;
  $(id).addEventListener('change', function () { store.set('ds_' + id, $(id).value); });
  $(id).addEventListener('input', function () { store.set('ds_' + id, $(id).value); });
});
$('stripS').checked = store.get('ds_stripS') === '1';
$('stripS').addEventListener('change', function () { store.set('ds_stripS', $('stripS').checked ? '1' : '0'); });

// ---------------- Sending to the Sheet ----------------
var hasGAS = typeof google !== 'undefined' && google.script && google.script.run;

function callServer(fn, payload) {
  return new Promise(function (resolve, reject) {
    if (hasGAS) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(new Error(e && e.message ? e.message : String(e)));
      })[fn](payload);
    } else if (CFG.API_URL) {
      var body = JSON.stringify({ action: fn, key: CFG.API_KEY, payload: payload });
      fetch(CFG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body })
        .then(function (r) { return r.json(); }).then(resolve).catch(reject);
    } else {
      reject(new Error('Not connected to a Sheet'));
    }
  });
}

// Offline queue: scans that could not be sent are kept and retried.
function getQueue() { try { return JSON.parse(store.get('ds_queue') || '[]'); } catch (e) { return []; } }
function setQueue(q) { store.set('ds_queue', JSON.stringify(q)); renderQueue(); }
function renderQueue() { var n = getQueue().length; $('queueBadge').textContent = n ? '(' + n + ' waiting to send)' : ''; }
var flushing = false;
function flushQueue() {
  if (flushing) return; var q = getQueue(); if (!q.length) return; flushing = true;
  (function next(i) {
    if (i >= q.length) { flushing = false; return; }
    callServer('recordScan', q[i]).then(function () {
      var cur = getQueue().filter(function (x) { return x.id !== q[i].id; }); setQueue(cur); next(i + 1);
    }).catch(function () { flushing = false; });
  })(0);
}
window.addEventListener('online', flushQueue);
setInterval(flushQueue, 20000);
renderQueue();

// ---------------- Recording a scan ----------------
var recent = []; var lastScan = null;
function renderRecent() {
  if (!recent.length) return;
  $('recent').innerHTML = recent.map(function (r) {
    return '<li><span class="c">' + esc(r.code) + (r.flag ? ' <span class="warn">' + esc(r.flag) + '</span>' : '') +
      '</span><span class="t">' + timeLabel(r.when) + '</span></li>';
  }).join('');
}
function showResult(code, format, statusHtml, canUndo) {
  $('result').innerHTML = '<div class="code">' + esc(code) + '</div><div class="muted">' + esc(format || '') +
    '</div><div class="status">' + statusHtml + '</div>' +
    (canUndo ? '<div class="btnrow"><button id="undoBtn" class="secondary">Undo this scan</button></div>' : '');
  if (canUndo) $('undoBtn').addEventListener('click', undoLast);
}
function flash(kind) {
  var f = $('flash'); f.className = 'flash ' + kind;
  setTimeout(function () { f.className = 'flash'; }, 120);
}

var audioCtx = null;
function beep(freq, ms) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq; g.gain.value = 0.15; o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + ms / 1000);
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
}

function handleCode(raw, format) {
  var code = String(raw || '').trim();
  if (!code) return;
  if ($('stripS').checked && /^S/i.test(code) && code.length > 1) code = code.slice(1);
  var scan = {
    id: uuid(), code: code, format: format || 'MANUAL',
    deviceType: $('deviceType').value.trim(), scannedBy: $('scannedBy').value.trim(),
    location: $('location').value, ts: new Date().toISOString()
  };
  lastScan = scan;
  var entry = { code: code, when: new Date(), flag: '' };
  recent.unshift(entry); if (recent.length > 10) recent.pop(); renderRecent();
  showResult(code, format, '<span class="muted">Saving...</span>', false);

  callServer('recordScan', scan).then(function (res) {
    if (res && res.ok) {
      if (res.duplicate) {
        entry.flag = 'duplicate'; flash('warn'); beep(330, 250);
        showResult(code, format, '<span class="warn">Saved, but already scanned ' + esc(res.firstSeen || '') + '</span>', true);
      } else {
        flash('ok'); beep(880, 120);
        showResult(code, format, '<span class="ok">Saved</span>', true);
      }
    } else {
      throw new Error((res && res.error) || 'Server said no');
    }
    renderRecent(); flushQueue();
  }).catch(function (e) {
    var q = getQueue(); q.push(scan); setQueue(q);
    entry.flag = 'queued'; flash('bad'); beep(200, 300); renderRecent();
    showResult(code, format, '<span class="bad">Not sent (' + esc(e.message) + '). Kept on this phone and will retry.</span>', false);
  });
}

function undoLast() {
  if (!lastScan) return;
  var s = lastScan; lastScan = null;
  // If it never reached the Sheet, just drop it from the queue.
  setQueue(getQueue().filter(function (x) { return x.id !== s.id; }));
  callServer('undoScan', { id: s.id }).then(function () {
    $('result').innerHTML = '<div class="status warn">Removed ' + esc(s.code) + '</div>';
    if (recent.length && recent[0].code === s.code) recent.shift();
    if (!recent.length) $('recent').innerHTML = '<li><span class="muted">None yet.</span></li>'; else renderRecent();
  }).catch(function (e) {
    $('result').innerHTML = '<div class="status bad">Could not undo: ' + esc(e.message) + '</div>';
  });
}

// ---------------- Camera scanning ----------------
var reader = null; var scanning = false;
var lastCode = '', lastTime = 0;

function formats() {
  var F = ZXing.BarcodeFormat;
  return [F.CODE_128, F.QR_CODE, F.EAN_13, F.UPC_A, F.UPC_E, F.EAN_8, F.CODE_39, F.CODE_93, F.ITF, F.DATA_MATRIX, F.PDF_417, F.AZTEC];
}
function newReader() {
  var hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats());
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  return new ZXing.BrowserMultiFormatReader(hints, 250);
}

function startScan() {
  if (typeof ZXing === 'undefined') {
    $('placeholder').textContent = 'The scanner library did not load. Check your connection and reload.'; return;
  }
  $('placeholder').classList.add('hidden');
  $('startBtn').classList.add('hidden'); $('stopBtn').classList.remove('hidden');
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {}
  reader = newReader(); scanning = true;
  reader.decodeFromConstraints(
    { audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } },
    $('video'),
    function (result) {
      if (!result) return;
      var code = result.getText(); var now = Date.now();
      if (code === lastCode && now - lastTime < 4000) { lastTime = now; return; }   // same code still in view
      lastCode = code; lastTime = now;
      handleCode(code, ZXing.BarcodeFormat[result.getBarcodeFormat()]);
    }
  ).catch(function (e) {
    stopScan();
    $('placeholder').classList.remove('hidden');
    $('placeholder').innerHTML = 'Camera unavailable (' + esc(e && e.name ? e.name : 'error') +
      ').<br>Use <b>Take photo</b> or type the code below.';
  });
}
function stopScan() {
  scanning = false;
  try { if (reader) reader.reset(); } catch (e) {}
  $('startBtn').classList.remove('hidden'); $('stopBtn').classList.add('hidden');
}
$('startBtn').addEventListener('click', startScan);
$('stopBtn').addEventListener('click', function () { stopScan(); $('placeholder').classList.remove('hidden'); });

// ---------------- Photo and manual fallbacks ----------------
$('photoBtn').addEventListener('click', function () { $('photoInput').click(); });
$('photoInput').addEventListener('change', function () {
  var f = this.files && this.files[0]; this.value = ''; if (!f) return;
  if (typeof ZXing === 'undefined') { showResult('', '', '<span class="bad">Scanner library did not load.</span>', false); return; }
  var url = URL.createObjectURL(f);
  var r = newReader();
  r.decodeFromImageUrl(url).then(function (res) {
    handleCode(res.getText(), ZXing.BarcodeFormat[res.getBarcodeFormat()]);
  }).catch(function () {
    $('result').innerHTML = '<div class="status bad">No barcode found in that photo. Get closer, hold steady, and try again.</div>';
  }).then(function () { URL.revokeObjectURL(url); try { r.reset(); } catch (e) {} });
});
function addManual() {
  var v = $('manual').value.trim(); if (!v) return;
  $('manual').value = ''; handleCode(v, 'MANUAL');
}
$('manualBtn').addEventListener('click', addManual);
$('manual').addEventListener('keydown', function (e) { if (e.key === 'Enter') addManual(); });

document.addEventListener('visibilitychange', function () { if (document.hidden && scanning) stopScan(); });
</script>
</body>
</html>
